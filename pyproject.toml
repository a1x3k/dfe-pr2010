[project]
name = "dfe-pr2010"
version = "0.1.0"
description = "Defocus map estimation from a single image (Zhuo & Sim, Pattern Recognition 2011)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[project.scripts]
dfe-pr2010 = "dfe_pr2010.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
